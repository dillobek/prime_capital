services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-https://web.aipixel.uz}
      DATA_FILE: /app/data/platform.json
    volumes:
      - prime_data:/app/data
    ports: ["4000:4000"]
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      API_URL: http://backend:4000/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports: ["3000:3000"]
    depends_on: [backend]
    restart: unless-stopped
  webapp:
    build:
      context: .
      dockerfile: Webapp/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      API_URL: http://backend:4000/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports: ["3001:3001"]
    depends_on: [backend]
    restart: unless-stopped
  website:
    build:
      context: .
      dockerfile: Website/Dockerfile
    ports: ["3002:3002"]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend, webapp]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  prime_data:
