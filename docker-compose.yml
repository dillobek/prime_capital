services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-https://web.primecapital.uz}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
      ESKIZ_OTP_TEMPLATE: "${ESKIZ_OTP_TEMPLATE:-Prime Capital ilovasiga kirish uchun bir martalik kod: {code} KODNI HECH KIMGA BERMANG.}"
      DATA_FILE: /app/data/platform.json
    volumes:
      - prime_data:/app/data
    ports: ["127.0.0.1:4100:4000"]
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      API_URL: http://backend:4000/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports: ["127.0.0.1:4101:3000"]
    depends_on: [backend]
    restart: unless-stopped
  webapp:
    build:
      context: .
      dockerfile: Webapp/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      API_URL: http://backend:4000/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports: ["127.0.0.1:4102:3001"]
    depends_on: [backend]
    restart: unless-stopped
  website:
    build:
      context: .
      dockerfile: Website/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      API_URL: http://backend:4000/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports: ["127.0.0.1:4103:3002"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  prime_data:
